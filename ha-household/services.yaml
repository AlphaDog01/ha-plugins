set_chore:
  name: Set Chore
  description: >
    Apply one chore action to a targeted person's chores sensor (e.g.
    sensor.hades_mike_chores_today). Routes through the exact same handler
    the chores webhook uses. Pick the entity under Targets — no need to
    type the person's name.
  target:
    entity:
      domain: sensor
      integration: hades_household
  fields:
    action:
      name: Action
      description: What to do with this chore.
      required: true
      default: "add"
      example: "add"
      selector:
        select:
          options:
            - "add"
            - "complete"
            - "skip"
            - "reset"
    chore_name:
      name: Chore Name
      description: Required unless action is "reset".
      example: "Feed Cats"
      selector:
        text:
    chore_points:
      name: Chore Points
      description: Points this chore is worth. Added to the running total when action is "complete".
      example: 10
      default: 0
      selector:
        number:
          min: 0
          mode: box
