set_chores:
  name: Set Chores
  description: >
    Apply one chore action for one person. Builds the exact same payload
    shape the chores webhook receives and routes it through the same
    dispatcher — this is a real test of the webhook path, not a separate
    one. Use action "reset" to clear a person's lists and points back to
    zero (chore_name/chore_points are ignored for reset).
  fields:
    person:
      name: Person
      description: "One of: caleb, courtney, mike, heather, cameron"
      required: true
      example: "mike"
      selector:
        select:
          options:
            - "caleb"
            - "courtney"
            - "mike"
            - "heather"
            - "cameron"
    action:
      name: Action
      description: What to do with this chore.
      required: true
      example: "add"
      default: "add"
      selector:
        select:
          options:
            - "add"
            - "complete"
            - "skip"
            - "reset"
    chore_name:
      name: Chore Name
      description: Required unless action is "reset".
      example: "Feed Cats"
      selector:
        text:
    chore_points:
      name: Chore Points
      description: Points this chore is worth. Added to the running total when action is "complete".
      example: 10
      default: 0
      selector:
        number:
          min: 0
          mode: box
